<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Water Water</title>
  <meta name="description" content="Search any address, street or region to see what research has found in its drinking water.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home">
  <main class="home-main">
    <h1 class="logo" aria-label="Water Water">
      <span class="logo-word">Water</span><span class="logo-word alt">Water</span>
    </h1>
    <svg class="wave" viewBox="0 0 240 16" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 8 Q 15 0 30 8 T 60 8 T 90 8 T 120 8 T 150 8 T 180 8 T 210 8 T 240 8 T 270 8 T 300 8"/>
    </svg>
    <p class="tagline">What’s in the water where you live?</p>

    <form class="search big" id="search" role="search" autocomplete="off">
      <i class="s-icon" data-icon="search"></i>
      <input type="search" name="q" placeholder="Search an address, street, city or region" aria-label="Search a place"
             role="combobox" aria-autocomplete="list" aria-controls="suggestions" autofocus>
      <button type="button" class="icon-btn" id="near-me" title="Use my location" aria-label="Use my location"><i data-icon="locate"></i></button>
      <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
    </form>

    <div class="home-actions">
      <button form="search" type="submit" class="btn">Check my water</button>
      <a class="btn ghost" href="map.html?q=World&amp;view=world">Explore the map</a>
    </div>

    <div class="try">Try:
      <a href="map.html?q=Flint%2C%20Michigan">Flint, Michigan</a>
      <a href="map.html?q=Dhaka%2C%20Bangladesh">Dhaka</a>
      <a href="map.html?q=Nakuru%2C%20Kenya">Nakuru</a>
      <a href="map.html?q=Wilmington%2C%20North%20Carolina">Wilmington, NC</a>
    </div>

    <section class="learn-wrap" id="learn" aria-label="Learn more"></section>
  </main>

  <footer class="foot">
    Based on published research, not a test of your tap · Map data © OpenStreetMap contributors
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/research.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/geocode.js"></script>
  <script src="js/searchbox.js"></script>
  <script src="js/learn.js"></script>
  <script>
    hydrateIcons();
    attachSearch(document.getElementById('search'));
    renderLearn(document.getElementById('learn'));
    document.getElementById('near-me').addEventListener('click', () => {
      if (!navigator.geolocation) return alert('Location is not available in this browser.');
      navigator.geolocation.getCurrentPosition(
        p => { window.location.href = resultsUrl({ q: `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}` }); },
        () => alert('Could not get your location. Type an address instead.'));
    });
  </script>
</body>
</html>
