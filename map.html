<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Water Water — Report</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="mapview">
  <div id="map" aria-label="Map"></div>

  <header class="topbar">
    <a href="index.html" class="logo small" aria-label="Water Water home"><span class="logo-word">Water</span><span class="logo-word alt">Water</span></a>
    <form class="search" id="search" role="search" autocomplete="off">
      <i class="s-icon" data-icon="search"></i>
      <input type="search" name="q" placeholder="Search an address, street, city or region" aria-label="Search a place"
             role="combobox" aria-autocomplete="list" aria-controls="suggestions">
      <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
    </form>
  </header>

  <div class="compare-bar" id="compare-bar" hidden></div>

  <aside class="panel" id="panel">
    <button class="panel-toggle" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">
      <span class="grip"></span><span class="sr">Show or hide report</span>
    </button>
    <div class="panel-body" id="panel-body">
      <div id="report-head"><p class="loading"><i data-icon="drop"></i> Preparing report…</p></div>
      <nav class="tabs" id="tabs" role="tablist" hidden>
        <button role="tab" aria-selected="true" data-tab="findings">Findings</button>
        <button role="tab" aria-selected="false" data-tab="impact">Health impact</button>
        <button role="tab" aria-selected="false" data-tab="sources">Sources</button>
      </nav>
      <section id="tab-findings" role="tabpanel"></section>
      <section id="tab-impact" role="tabpanel" hidden></section>
      <section id="tab-sources" role="tabpanel" hidden></section>
      <p class="fine disclaimer">Compiled from published studies and official reports for this area. Not a test of your tap — for your exact supply, request your provider’s latest water quality report or use a certified laboratory.</p>
    </div>
  </aside>

  <div class="map-legend" id="legend"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/research.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/geocode.js"></script>
  <script src="js/searchbox.js"></script>
  <script src="data/countries.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
